[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvstudio"
version = "0.2.0"
description = "Audio-driven AI music video pipeline: song + brief + characters -> analysed audio -> checked scenebook -> ComfyUI render"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "requests>=2.31",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "librosa>=0.10.2",
  "soundfile>=0.12",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
# Lyrics transcription (word timestamps). Needs CUDA-enabled ctranslate2 for GPU use.
asr = ["faster-whisper>=1.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
mvs = "mvstudio.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mvstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "E741"]
