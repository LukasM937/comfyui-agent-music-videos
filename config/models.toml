# Model manifest. `mvs models status|download` and scripts/setup.sh read this file.
# Sizes are exact byte counts from the Hugging Face file listings (checked 2026-10-12).
# dest = "comfy:<folder>/<file>"  -> <ComfyUI>/models/<folder>/<file>
# dest = "llm:<file>"             -> ~/models/llm/<file>
# kind = "snapshot"               -> whole repo into the Hugging Face cache (faster-whisper)
#
# group = core     -> everything for the default pipeline (keyframes + LTX-2.5 clips + planner LLM)
# group = lipsync  -> LTX-2.3 image+audio->video (singer on camera / audio-driven motion)
# group = asr      -> lyrics transcription
# group = extras   -> optional speed/quality variants

[[model]]
id = "ltx25_unet_int8"
group = "core"
repo = "Lightricks/LTX-2.5"
file = "diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
dest = "comfy:diffusion_models/ltx-2.5-22b-distilled-transformer-comfy-int8-convrot.safetensors"
size = 21504034224
gated = true
note = "LTX-2.5 22B distilled, int8. Accept the licence on the repo page first."

